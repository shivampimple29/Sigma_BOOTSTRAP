<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container">
        <h1>Buttons</h1>
        <div class="btn">Deafult</div>
        <div class="btn btn-primary">primary</div>
        <div class="btn btn-secondary">secondary</div>
        <div class="btn btn-danger">Danger</div>
        <div class="btn btn-success">Success</div>
        <div class="btn btn-safe">Safe</div>
        <div class="btn btn-warning">warning</div>
        <div class="btn btn-light">Light</div>
        <div class="btn btn-dark">Dark</div>
        <div class="btn btn-link">Link</div><br><br>

        <h1>Linking Buttons</h1>
        <a class="btn btn-primary" href="#" role="button">Link</a>
        <button class="btn btn-primary" type="submit">Button</button>
        <input class="btn btn-primary" type="button" value="Input">
        <input class="btn btn-primary" type="submit" value="Submit">
        <input class="btn btn-primary" type="reset" value="Reset"><br><br>

        <h1>Outline Buttons</h1>
        <button type="button" class="btn btn-outline-primary">Primary</button>
        <button type="button" class="btn btn-outline-secondary">Secondary</button>
        <button type="button" class="btn btn-outline-success">Success</button>
        <button type="button" class="btn btn-outline-danger">Danger</button>
        <button type="button" class="btn btn-outline-warning">Warning</button>
        <button type="button" class="btn btn-outline-info">Info</button>
        <button type="button" class="btn btn-outline-light">Light</button>
        <button type="button" class="btn btn-outline-dark">Dark</button><br><br>

        <h1>Button Size</h1>
        <button type="button" class="btn btn-primary btn-sm">Small button</button>
        <button type="button" class="btn btn-primary btn-lg">Large button</button><br><br>

        <h1>Button Disable</h1>
        <button type="button" class="btn btn-primary" disabled>disabled</button>
        <a class="btn btn-primary disabled" role="button" aria-disabled="true">Primary link</a><br><br>

        <h1>Buttons with gap</h1>
        <div class="d-grid gap-2">
            <button class="btn btn-primary" type="button">Button</button>
            <button class="btn btn-primary" type="button">Button</button>
        </div><br><br>

        <h1>Buttons Centered</h1>
        <div class="d-grid gap-2 col-6 mx-auto">
            <button class="btn btn-primary" type="button">Button</button>
            <button class="btn btn-primary" type="button">Button</button>
        </div><br><br>

        <h1>Button Toggle</h1>
        <p class="d-inline-flex gap-1">
            <button type="button" class="btn" data-bs-toggle="button">Toggle button</button>
            <button type="button" class="btn active" data-bs-toggle="button" aria-pressed="true">Active toggle
                button</button>
            <button type="button" class="btn" disabled data-bs-toggle="button">Disabled toggle button</button>
        </p><br><br><br><br><br><br>

        <div id="liveAlertPlaceholder"></div>
        <button type="button" class="btn btn-primary" id="liveAlertBtn">Show live alert</button>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
